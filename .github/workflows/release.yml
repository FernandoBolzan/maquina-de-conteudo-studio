name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable tag to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: dist:linux
          - os: windows-latest
            script: dist:windows
          - os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate stable tag matches package version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: node -e "const tag = process.env.RELEASE_TAG; const expected = 'v' + require('./package.json').version; if (!/^v\\d+\\.\\d+\\.\\d+$/.test(tag) || tag !== expected) { console.error('Expected matching stable SemVer tag:', expected, 'got', tag); process.exit(1); }"
        shell: bash
      - run: npm run ${{ matrix.script }}
      - name: Verify macOS app is ad-hoc signed and structurally valid
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/mac-signature-check"
          unzip -q release/*-arm64.zip -d "$RUNNER_TEMP/mac-signature-check"
          APP_PATH="$(find "$RUNNER_TEMP/mac-signature-check" -maxdepth 4 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH"
          codesign -dv --verbose=2 "$APP_PATH" 2>&1 | grep -q '^Signature=adhoc$'
        env:
          RUNNER_TEMP: ${{ runner.temp }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.dmg
            release/*.zip
            release/latest.yml
            release/latest-linux.yml
            release/latest-mac.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 2

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Verify updater feeds match the assets
        env:
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: node scripts/verify-release-assets.mjs release-assets "$TAG"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: gh release create "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag
